plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.visecore'
version = '1.0.0'

android {
  namespace "expo.modules.visecore"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    // librust_core.so per ABI, produced by scripts/build-android-core.sh
    main { jniLibs.srcDirs = ['src/main/jniLibs'] }
  }
}

dependencies {
  // On-device text recognition (Latin script), bundled with the app so it works offline.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
