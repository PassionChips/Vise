[package]
name = "rust-core"
version = "0.1.0"
edition = "2024"

[lib]
# rlib for tests and the CLI; cdylib for Android (.so); staticlib for iOS (.a)
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
diesel = { version = "2",features = ["sqlite", "returning_clauses_for_sqlite_3_35"]}
diesel_migrations = "2"
libsqlite3-sys = { version = "0.35",features = ["bundled"]}
csv = "1.4.0"
chrono = "0.4.45"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3.27.0"
