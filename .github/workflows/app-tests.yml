name: App Tests

# Runs on every change under vise-app/, including rust-core: the contract test compares the
# TypeScript types with rust-core/contracts/api-shapes.json, which the Rust tests also check.
on:
  push:
    branches: [main]
    paths:
      - "vise-app/**"
  pull_request:
    paths:
      - "vise-app/**"

jobs:
  app-tests:
    name: Type-check and unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vise-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vise-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Bridge client, onboarding payload, contract with rust-core, and the
      # "no demo data / no silent fallback" guards.
      - name: Unit tests
        run: npm test
