name: TypeScript Type-Check

on:
  push:
    branches: [main]
    paths:
      - "vise-app/**"
      - "!vise-app/rust-core/**"
      - "!vise-app/python-analytics/**"
  pull_request:
    paths:
      - "vise-app/**"
      - "!vise-app/rust-core/**"
      - "!vise-app/python-analytics/**"

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vise-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vise-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
