name: Rust Core Tests

on:
  pull_request:
    paths:
      - "vise-app/rust-core/**"

jobs:
  test:
    name: Rust core tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vise-app/rust-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vise-app/rust-core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('vise-app/rust-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Unit tests, the API/onboarding tests, the file-database persistence tests
      # (tests/persistence.rs) and the JSON contract test (tests/contract.rs).
      - name: Run all Rust tests
        run: cargo test --all-targets --locked
