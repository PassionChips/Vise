name: Python Lint

on:
  push:
    branches: [main]
    paths:
      - "vise-app/python-analytics/**"
  pull_request:
    paths:
      - "vise-app/python-analytics/**"

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vise-app/python-analytics

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .
